<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Jogos</title>

    <link rel="stylesheet" href="css.css">
</head>

<body>

    <!-- =====================================
         CABEÇALHO
    ====================================== -->

    <header>

        <div class="logo-area">
            <img src="Imagens/logo-ludora.png" alt="Logo Ludora">
        </div>

        <div class="menu">

            <div class="carrinho">
                🛒
                <span>Carrinho</span>
            </div>

            <div class="usuario">
                <div class="cabeca"></div>
                <div class="corpo"></div>
            </div>

        </div>

    </header>


    <!-- =====================================
         CONTEÚDO PRINCIPAL
    ====================================== -->

    <main>

        <!-- TÍTULO -->

        <h1>
            Gerencie seus jogos com os melhores<br>
            preços
        </h1>


        <!-- =====================================
             BARRA DE PESQUISA
        ====================================== -->

        <div class="pesquisa">

            <span class="lupa">⌕</span>

            <input
                type="text"
                id="campoPesquisa"
                placeholder="Digite o nome do console aqui"
            >

        </div>


        <!-- =====================================
             CARROSSEL DE PLATAFORMAS
        ====================================== -->

        <div class="plataformas">

            <div class="track">


                <!-- GRUPO 1 -->

                <div class="grupo-logos">

                    <div class="plataforma">
                        <img src="Imagens/Xbox.webp" alt="Xbox">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/Playstation.webp" alt="PlayStation">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/Nintendo.svg" alt="Nintendo">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/PC.png" alt="PC">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/Steam.png" alt="Steam">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/epic.webp" alt="Epic Games">
                    </div>

                </div>


                <!-- GRUPO 2 -->

                <div class="grupo-logos">

                    <div class="plataforma">
                        <img src="Imagens/Xbox.webp" alt="Xbox">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/Playstation.webp" alt="PlayStation">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/Nintendo.svg" alt="Nintendo">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/PC.png" alt="PC">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/Steam.png" alt="Steam">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/epic.webp" alt="Epic Games">
                    </div>

                </div>


                <!-- GRUPO 3 -->

                <div class="grupo-logos">

                    <div class="plataforma">
                        <img src="Imagens/Xbox.webp" alt="Xbox">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/Playstation.webp" alt="PlayStation">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/Nintendo.svg" alt="Nintendo">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/PC.png" alt="PC">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/Steam.png" alt="Steam">
                    </div>

                    <div class="plataforma">
                        <img src="Imagens/epic.webp" alt="Epic Games">
                    </div>

                </div>

            </div>

        </div>


        <!-- =====================================
             BOTÕES DO SISTEMA
        ====================================== -->

        <div class="botoes">

            <!-- RF01 -->
            <button type="button" onclick="addJogo()">
                Adicionar jogo ao carrinho
            </button>

            <!-- RF03 -->
            <button type="button" onclick="showJogo()">
                Mostrar todos os jogos
            </button>

            <!-- RF04 -->
            <button type="button" onclick="encontrarJogo()">
                Buscar um jogo pelo nome
            </button>

            <!-- RF02 -->
            <button type="button" onclick="deletarPeloId()">
                Excluir um jogo pelo ID
            </button>

            <!-- RF05 -->
            <button type="button" onclick="removerUltimo()">
                Remover último jogo
            </button>

            <!-- RF06 -->
            <button type="button" onclick="limparTudo()">
                Limpar todos os jogos
            </button>

            <!-- RF07 -->
            <button type="button" onclick="mostrarTotal()">
                Mostrar total de jogos
            </button>

        </div>

    </main>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>

</body>

</html>
